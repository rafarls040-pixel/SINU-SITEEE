<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SINU 2026 - Simulação Interna das Nações Unidas</title>
    <link rel="icon" href="https://sinu-csl-site.s3.sa-east-1.amazonaws.com/LOGO/LOGO+DA+SINU+pro+tab+do+site.png" />
    
    <!-- Preload Hero Image -->
    <link rel="preload" as="image" href="https://sinu-csl-site.s3.sa-east-1.amazonaws.com/secretariado/LOGO+DA+SINU+OFC.png" fetchpriority="high" />
    
    <!-- Preload CSS -->
    <link rel="preload" as="style" href="/index.css" />

    <!-- Preload and Load Fonts with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
    </noscript>

    <!-- Critical CSS Inline -->
    <style>
      body {
        margin: 0;
        background-color: #ffffff; /* bg-white */
        color: #1e293b; /* text-slate-800 */
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: block;
      }
      /* Hero Section Critical CSS */
      .hero-critical {
        position: relative;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #ffffff;
      }
      .hero-critical-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 64rem;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        margin-top: -4rem;
      }
      .hero-critical-title {
        color: #03005c;
        font-size: 5rem;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        letter-spacing: -0.05em;
        line-height: 0.9;
        text-align: center;
        margin: 0;
      }
      @media (min-width: 640px) {
        .hero-critical-title { font-size: 8rem; }
      }
      @media (min-width: 768px) {
        .hero-critical-title { font-size: 10rem; line-height: 0.8; }
      }
      @media (min-width: 1024px) {
        .hero-critical-title { font-size: 12rem; }
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "framer-motion": "https://esm.sh/framer-motion@^12.29.2",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
    
    <!-- Defer non-critical CSS -->
    <link rel="stylesheet" href="/index.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/index.css"></noscript>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-un-blue selection:text-white">
    <div id="root">
      <div class="hero-critical">
        <div class="hero-critical-content">
          <img src="https://sinu-csl-site.s3.sa-east-1.amazonaws.com/secretariado/LOGO+DA+SINU+OFC.png" alt="Logo SINU" style="width: 16rem; height: 16rem; object-fit: contain; margin-bottom: 1rem;" />
          <h1 class="hero-critical-title">SINU <span style="color: #fecc00; font-weight: 300; font-style: italic;">XX</span></h1>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx" defer></script>
  </body>
</html>
